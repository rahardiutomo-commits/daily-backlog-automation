name: Daily Backlog Automation

on:
  schedule:
    # Berjalan Otomatis Jam 08:00 WIB (Sama dengan 01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run Manual' di GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Main Script
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: python main.py
