name: Daily Backlog Automation

on:
  schedule:
    # 00:55 UTC = Jam 07:55 WIB (Setiap Hari)
    - cron: '55 0 * * *'
  workflow_dispatch: # Agar tombol 'Run Manual' tetap ada

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Execute Main Script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python main.py
